worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Temp paths writable without root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen ${PORT};

        # ── Security headers ──────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data: https://api.fontshare.com https://cdn.fontshare.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Inherit security headers in every location; do not override with per-location add_header.
        add_header Cache-Control "no-store" always;

        # FastAPI backend: /api/* routes
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;

            # Disable buffering for SSE streaming
            proxy_buffering off;
            proxy_cache off;
        }

        # Preserve the original frontend at a stable, slash-terminated URL.
        location = /classic {
            return 308 /classic/;
        }

        location ^~ /classic/ {
            alias /app/frontend-v2/;
            index index.html;
        }

        # Introduction first; the existing workspace remains a direct entry.
        location = / {
            root /app/frontend-v3;
            try_files /landing.html =404;
        }

        location = /workspace {
            return 308 /workspace/;
        }

        location = /workspace/ {
            root /app/frontend-v3;
            try_files /index.html =404;
        }

        # Shared workspace and landing assets; all paths are root-relative.
        # Missing JS/CSS must return 404, never index.html with the wrong MIME type.
        location / {
            root /app/frontend-v3;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Legacy Streamlit frontend remains disabled.
        # location /legacy/ { ... }
        # location /legacy/_stcore/ { ... }
    }
}
